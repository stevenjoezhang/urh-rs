name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Default features: no native build deps at all (soundcard/cpal is an
      # opt-in feature, exercised by the soundcard job below).
      - name: Build (debug + release)
        run: |
          cargo build --all-targets
          cargo build --release --bin urh-cli

      - name: Test
        run: cargo test --no-fail-fast

      # The python ground-truth comparison in tests/cli_compare.rs needs the
      # original URH sources and a venv; it skips itself when unavailable.
      # Run it on one Linux job where we set that up.
      - name: Python ground-truth compare (linux only)
        if: runner.os == 'Linux'
        env:
          URH_REF_SRC: /home/runner/urh-ref/src
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          python3 -m venv /tmp/urh-venv
          /tmp/urh-venv/bin/pip install -q numpy psutil PyQt6 cython setuptools
          git clone --depth 1 https://github.com/jopohl/urh /home/runner/urh-ref
          cd /home/runner/urh-ref && /tmp/urh-venv/bin/python setup.py build_ext --inplace
          cd - && cargo test --test cli_compare -- --nocapture

      - name: CLI smoke
        shell: bash
        run: cargo run --quiet --bin urh-cli -- analyze tests/data/ask.complex

  # Opt-in soundcard feature (cpal -> CoreAudio/WASAPI/ALSA). Needs
  # libasound2-dev on Linux; nothing extra on macOS/Windows.
  soundcard:
    name: soundcard feature (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build + test with soundcard feature
        run: |
          cargo build --features soundcard
          cargo test --features soundcard --lib -- devices

  # sdrbuild-style job: collect the *real* vendor driver libraries from
  # their official upstream sources and run the native device backend
  # tests, so the dlopen paths are exercised with actual libraries
  # present instead of only the LibraryUnavailable path. Without physical
  # hardware open() must fail cleanly (OpenFailed) and device_list() must
  # not panic — that is exactly what these tests assert via their
  # lib_present() branches.
  #
  # Windows collects everything from upstream (libusb / fftw.org / GSG /
  # osmocom / airspy / myriadrf / Nuand / ADI / zlatkovic) — no third-party
  # driver bundles, so this repository stays self-contained without
  # committing any binaries. (UHD and SDRPlay cannot be fetched
  # automatically; see the notes below. Their dlopen paths are covered by
  # the ubuntu job via apt / by real-hardware machines respectively.)
  drivers:
    name: driver-present dlopen (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install vendor libraries (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhackrf-dev librtlsdr-dev libbladerf-dev liblimesuite-dev \
            libiio-dev libuhd-dev libairspy-dev
      # SDRPlay has no distro package (license-restricted download); it stays
      # covered by the LibraryUnavailable path here and by real-hardware
      # testing on a machine with the SDRplay API installed.

      # ------------------------------------------------------------------
      # Windows: official-source collection (no binary blobs in this repo,
      # no third-party bundles — every URL below is the vendor's own).
      # ------------------------------------------------------------------
      - name: Setup dist folder + tools (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir dist work
          choco install -y --no-progress innoextract

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: libusb 1.0.25 (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL --retry 3 -o work/libusb.7z \
            https://github.com/libusb/libusb/releases/download/v1.0.25/libusb-1.0.25.7z
          7z x work/libusb.7z -owork/libusb > /dev/null
          cp work/libusb/VS2019/MS64/Release/dll/libusb-1.0.dll dist/
          ls work/libusb/VS2019/MS64/Release/lib/

      - name: pthreads-w32 2.9.1 (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL --retry 3 -o work/pthreads.zip \
            https://www.mirrorservice.org/sites/sourceware.org/pub/pthreads-win32/pthreads-w32-2-9-1-release.zip
          7z x work/pthreads.zip -owork/pthreads > /dev/null
          ls work/pthreads/Pre-built.2/lib/

      - name: FFTW 3.3.5 (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL --retry 3 -o work/fftw.zip \
            https://fftw.org/pub/fftw/fftw-3.3.5-dll64.zip
          7z x work/fftw.zip -owork/fftw > /dev/null
          # the zip ships .def only — import libs are generated here
          cd work/fftw
          lib /machine:x64 /def:libfftw3-3.def
          lib /machine:x64 /def:libfftw3f-3.def
          cd ../..
          cp work/fftw/libfftw3f-3.dll dist/

      - name: AirSpy — build from source (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/airspy/airspyone_host work/airspy
          cmake -S work/airspy -B work/airspy/build -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DLIBUSB_LIBRARIES=$PWD/work/libusb/VS2019/MS64/Release/lib/libusb-1.0.lib \
            -DLIBUSB_INCLUDE_DIR=$PWD/work/libusb/include/libusb-1.0 \
            -DTHREADS_PTHREADS_INCLUDE_DIR=$PWD/work/pthreads/Pre-built.2/include \
            -DTHREADS_PTHREADS_WIN32_LIBRARY=$PWD/work/pthreads/Pre-built.2/lib/x64/pthreadVC2.lib
          cmake --build work/airspy/build --parallel --config Release
          cmake --install work/airspy/build --prefix $PWD/dist --config Release

      - name: HackRF v2024.02.1 — build from source (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git clone --branch v2024.02.1 --depth 1 https://github.com/greatscottgadgets/hackrf work/hackrf
          cmake -S work/hackrf/host -B work/hackrf/host/build -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DLIBUSB_LIBRARIES=$PWD/work/libusb/VS2019/MS64/Release/lib/libusb-1.0.lib \
            -DLIBUSB_INCLUDE_DIR=$PWD/work/libusb/include/libusb-1.0 \
            -DTHREADS_PTHREADS_INCLUDE_DIR=$PWD/work/pthreads/Pre-built.2/include \
            -DTHREADS_PTHREADS_WIN32_LIBRARY=$PWD/work/pthreads/Pre-built.2/lib/x64/pthreadVC2.lib \
            -DFFTW_INCLUDES=$PWD/work/fftw \
            -DFFTW_LIBRARIES=$PWD/work/fftw/libfftw3f-3.lib
          cmake --build work/hackrf/host/build --parallel --config Release
          cmake --install work/hackrf/host/build --prefix $PWD/dist --config Release

      - name: RTL-SDR — build from source (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/osmocom/rtl-sdr work/rtlsdr
          cmake -S work/rtlsdr -B work/rtlsdr/build -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DLIBUSB_LIBRARIES=$PWD/work/libusb/VS2019/MS64/Release/lib/libusb-1.0.lib \
            -DLIBUSB_INCLUDE_DIRS=$PWD/work/libusb/include/libusb-1.0 \
            -DTHREADS_PTHREADS_INCLUDE_DIR=$PWD/work/pthreads/Pre-built.2/include \
            -DTHREADS_PTHREADS_LIBRARY=$PWD/work/pthreads/Pre-built.2/lib/x64/pthreadVC2.lib
          cmake --build work/rtlsdr/build --parallel --config Release
          cmake --install work/rtlsdr/build --prefix $PWD/dist --config Release

      - name: LimeSuite — build from source (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL --retry 3 -o work/FX3SDK.zip \
            http://downloads.myriadrf.org/project/limesuite/appveyor/FX3SDK.zip
          7z x work/FX3SDK.zip -owork/fx3sdk > /dev/null
          git clone --depth 1 https://github.com/myriadrf/LimeSuite work/limesuite
          cmake -S work/limesuite -B work/limesuite/build -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DENABLE_GUI=OFF -DFX3_SDK_PATH=$PWD/work/fx3sdk
          cmake --build work/limesuite/build --parallel --config Release
          cmake --install work/limesuite/build --prefix $PWD/dist --config Release

      - name: BladeRF 2024.05 — official installer (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL --retry 3 -o work/bladerf.exe \
            https://github.com/Nuand/bladeRF/releases/download/2024.05/bladeRF-win-installer-2024.05.exe
          innoextract work/bladerf.exe -d work/bladerf
          cp work/bladerf/app/x64/*.dll dist/

      - name: PlutoSDR libiio v0.23 + deps — official releases (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL --retry 3 -o work/iio.zip \
            https://github.com/analogdevicesinc/libiio/releases/download/v0.23/Windows-VS-16-2019-x64.zip
          7z x work/iio.zip -owork/iio > /dev/null
          cp work/iio/Windows-VS-16-2019-x64/libiio.dll dist/
          # uhd.dll runtime deps
          curl -sL --retry 3 -o work/libxml2.7z \
            https://www.zlatkovic.com/pub/libxml/64bit/libxml2-2.9.3-win32-x86_64.7z
          7z x work/libxml2.7z -owork/libxml2 > /dev/null
          cp work/libxml2/bin/libxml2-2.dll dist/
          curl -sL --retry 3 -o work/zlib.7z \
            https://www.zlatkovic.com/pub/libxml/64bit/zlib-1.2.8-win32-x86_64.7z
          7z x work/zlib.7z -owork/zlib > /dev/null
          cp work/zlib/bin/zlib*.dll dist/
          curl -sL --retry 3 -o work/iconv.7z \
            https://www.zlatkovic.com/pub/libxml/64bit/iconv-1.14-win32-x86_64.7z
          7z x work/iconv.7z -owork/iconv > /dev/null
          cp work/iconv/bin/libiconv*.dll dist/
          curl -sL --retry 3 -o work/mingw.7z \
            https://www.zlatkovic.com/pub/libxml/64bit/mingwrt-5.2.0-win32-x86_64.7z
          7z x work/mingw.7z -owork/mingwrt > /dev/null
          cp work/mingwrt/bin/libgcc*.dll work/mingwrt/bin/libwin*.dll dist/
          cp work/pthreads/Pre-built.2/dll/x64/pthreadVC2.dll dist/

      # SDRPlay: no automated source exists — sdrplay.com is license-
      # restricted AND behind Cloudflare bot protection (403 for CI
      # downloaders), and there is no official GitHub release. Its Windows
      # dlopen path stays covered by the LibraryUnavailable branch here;
      # real-library coverage happens on machines with the SDRplay API
      # installed (e.g. local real-hardware validation).

      # UHD: files.ettus.com now sits behind Cloudflare bot protection (403
      # for CI downloaders) and has no official GitHub binary release, so
      # the Windows job cannot fetch it automatically. The usrp backend's
      # dlopen path stays covered by the ubuntu job (apt libuhd-dev).

      - name: Collected libraries (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # flatten cmake install layout (<prefix>/bin, <prefix>/lib)
          mv dist/bin/* dist/ 2>/dev/null || true
          mv dist/lib/* dist/ 2>/dev/null || true
          ls -la dist/

      - name: Run device backend tests with libraries present
        if: runner.os == 'Linux'
        run: cargo test --lib -- devices::native --nocapture --test-threads=1

      - name: Run device backend tests with libraries present (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export PATH="$PWD/dist:$PATH"
          cargo test --lib -- devices::native --nocapture --test-threads=1

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets
