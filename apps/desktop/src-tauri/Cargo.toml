[package]
name = "urh-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
description = "urh desktop GUI — Tauri 2 shell (React + WebGL2 frontend in ../)"
default-run = "urh-desktop"

[lib]
name = "urh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
urh-app.workspace = true
serde.workspace = true
serde_json.workspace = true
# capture://batch event bodies: Tauri 2 events are JSON-serialized, so the
# raw LE f32 I/Q bytes ride as base64 (docs/ipc-contract.md "Device capture")
base64 = "0.22"

[[bin]]
name = "urh-desktop"
path = "src/main.rs"
