[package]
name = "urh-core"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Universal Radio Hacker (URH) signal processing core"
license = "Apache-2.0"

[dependencies]
num-complex = "0.4"
num-traits = "0.2"
thiserror = "2"
libloading = "0.8"
cpal = "0.15"
quick-xml = "0.36"

[[bin]]
name = "urh-cli"
path = "src/bin/urh-cli.rs"

[profile.release]
debug = true
