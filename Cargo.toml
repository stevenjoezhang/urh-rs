[workspace]
members = ["crates/urh-app", "apps/desktop/src-tauri"]
# Plain `cargo test` / `cargo build` / `cargo clippy` at the repo root keep
# covering only the root `urh` crate; the GUI layers are built explicitly
# (CI does this in the `gui` job) because the Tauri app needs system
# webkit/gtk dev libraries that not every machine has.
default-members = ["."]

[workspace.dependencies]
urh = { path = "." }
urh-app = { path = "crates/urh-app" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "urh"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Rust port of the Universal Radio Hacker (URH) signal processing core"
license = "Apache-2.0"
repository = "https://github.com/stevenjoezhang/urh-rs"
readme = "README.md"
documentation = "https://docs.rs/urh"
keywords = ["sdr", "radio", "signal", "urh", "rtlsdr"]
categories = ["science", "hardware-support"]

[dependencies]
num-complex = "0.4"
num-traits = "0.2"
thiserror = "2"
libloading = "0.8"
cpal = { version = "0.15", optional = true }
quick-xml = "0.36"

[features]
# Sound card backend (cpal) is the only build-time-linked native dependency
# (CoreAudio/WASAPI/ALSA). Off by default so the crate builds with zero
# system deps; enable with `--features soundcard`.
soundcard = ["dep:cpal"]

[[bin]]
name = "urh-cli"
path = "src/bin/urh-cli.rs"

[profile.release]
debug = true
